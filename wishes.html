<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1230">
  <title>Things I Hope For You · For Anjali</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-night theme-wishes" data-transition="petals" data-manual-reveal>
  <canvas class="sky" aria-hidden="true" data-density=".8"></canvas>
  <div class="moon" style="top:6%; right:14%; opacity:.7" aria-hidden="true"></div>

  <main class="page">
    <div class="stage stage--wide">
      <p class="eyebrow" data-reveal="200">chapter twelve</p>
      <h1 class="title" data-reveal="600" style="font-size:clamp(2rem,5.6vw,3.6rem)">Things I hope for you.</h1>
      <p class="lead" data-reveal="1200" style="color:var(--lilac)">Six flowers. One wish each. They bloom on their own — you just have to watch.</p>

      <div class="wish-garden" id="wishes" aria-label="Five blooming flowers, each with a wish"></div>
      <div class="wish-ground" aria-hidden="true"></div>

      <p class="hand" id="wish-end" style="font-size:1.35rem; color:var(--lilac-2); opacity:0; transition:opacity 1.5s var(--ease); margin-top:1rem">and one more that doesn't fit in a flower: I hope you know you're loved. by more people than you think.</p>
    </div>

    <nav class="page-nav" aria-label="Chapter navigation">
      <a class="btn btn-ghost nav-back" data-prev href="favorites.html">← Back</a>
      <span class="chapter" data-chapter></span>
      <a class="btn nav-next is-waiting" data-manual data-next href="memory.html">Continue <span class="arrow">→</span></a>
    </nav>
  </main>

  <script src="js/config.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/script.js"></script>
  <script src="js/animations.js"></script>
  <script>
    (function () {
      const wishes = [
        { icon: "🌷", name: "Happiness", text: "I hope you have more days that make you genuinely happy.", petals: "#e6c9ec", core: "#c48ad6", kind: "tulip" },
        { icon: "🌿", name: "Peace", text: "I hope life becomes a little softer for you.", petals: "#bda6e6", core: "#7452a8", kind: "daisy" },
        { icon: "🌙", name: "Dreams", text: "I hope the things you quietly wish for find their way to you.", petals: "#dccbf2", core: "#f0dfb0", kind: "bell" },
        { icon: "✨", name: "Growth", text: "I hope you keep becoming the person you want to be.", petals: "#c9a7de", core: "#5a3a8c", kind: "rose" },
        { icon: "🌸", name: "People", text: "I hope you always have people around you who appreciate you.", petals: "#e8d3f5", core: "#a57fb4", kind: "daisy" },
        { icon: "🍃", name: "Health", text: "I hope your body and mind stay strong, rested, and kind to you.", petals: "#d6c6ee", core: "#7fae86", kind: "tulip" }
      ];
      const heads = {
        daisy: (p, c) => { let s = ""; for (let i = 0; i < 9; i++) s += `<ellipse cx="50" cy="34" rx="7" ry="17" fill="${p}" transform="rotate(${i * 40} 50 34)" opacity=".95"/>`; return s + `<circle cx="50" cy="34" r="8" fill="${c}"/><circle cx="50" cy="34" r="3.5" fill="#f0dfb0" opacity=".8"/>`; },
        tulip: (p, c) => `<path d="M30 46c0-18 7-30 20-34 13 4 20 16 20 34 0 9-9 14-20 14s-20-5-20-14z" fill="${p}"/><path d="M50 12c-7 11-7 24-5 44M50 12c7 11 7 24 5 44" fill="none" stroke="${c}" stroke-width="1.2" opacity=".7"/>`,
        bell: (p, c) => { let s = ""; [[50, 16], [38, 34], [62, 34], [50, 52]].forEach(([x, y]) => s += `<path d="M${x - 9} ${y - 8}c0-7 4-10 9-10s9 3 9 10c0 6-3 9-9 14-6-5-9-8-9-14z" fill="${p}"/><circle cx="${x}" cy="${y + 3}" r="2" fill="${c}"/>`); return s; },
        rose: (p, c) => `<circle cx="50" cy="34" r="22" fill="${p}"/><path d="M50 14c11 0 20 9 20 20s-9 20-20 20-20-9-20-20 9-20 20-20zm0 7c-7 0-13 6-13 13s6 13 13 13 13-6 13-13-6-13-13-13zm0 6c4 0 7 3 7 7s-3 7-7 7-7-3-7-7 3-7 7-7z" fill="none" stroke="${c}" stroke-width="1.4" opacity=".9"/>`
      };
      const wrap = document.getElementById("wishes");
      wishes.forEach((w, i) => {
        const el = document.createElement("div"); el.className = "wish";
        el.innerHTML = `
          <div class="bloom"><svg viewBox="0 0 100 190" aria-hidden="true">
            <g class="stem"><path d="M50 188C48 150 52 120 50 66" fill="none" stroke="#7aa882" stroke-width="3" stroke-linecap="round"/></g>
            <g class="leaf"><path d="M50 140c-16-5-25 2-30 14 14 3 25-3 30-14z" fill="#6f9c76"/><path d="M50 118c16-5 25 2 30 14-14 3-25-3-30-14z" fill="#7fae86"/></g>
            <g class="petals" transform="translate(0 32)">${heads[w.kind](w.petals, w.core)}</g>
          </svg></div>
          <div class="wish-name">${w.icon} ${w.name}</div>
          <p class="wish-text">${w.text}</p>`;
        wrap.appendChild(el);
      });
      window.addEventListener("load", () => {
        setTimeout(() => revealSequence(), 200);
        const items = [...wrap.children];
        const fast = window.__chapter.reduceMotion;
        items.forEach((el, i) => setTimeout(() => {
          el.classList.add("is-bloomed");
          const r = el.querySelector(".bloom").getBoundingClientRect();
          setTimeout(() => sparkleAt(r.left + r.width / 2, r.top + r.height * .3, 8), fast ? 100 : 1600);
          if (innerWidth < 640) el.scrollIntoView({ behavior: fast ? "auto" : "smooth", block: "center" });
        }, (fast ? 300 : 2400) + i * (fast ? 300 : 3200)));
        const total = (fast ? 300 : 2400) + items.length * (fast ? 300 : 3200);
        setTimeout(() => { const e = document.getElementById("wish-end"); e.style.opacity = 1; e.scrollIntoView({ behavior: "smooth", block: "center" }); }, total + 600);
        setTimeout(showNext, total + 2200);
      });
    })();
  </script>
</body>
</html>
